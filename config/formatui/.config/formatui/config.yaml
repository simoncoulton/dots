show_unmatched: true
rule:
- name: tv
  pattern: '(?i)^(?P<title>.+?)(?: (?:19|20)\d{2})?(?: -)? S(?P<season>\d+)E(?P<episode>\d+)'
  template: '{title} - S{season|pad2}E{episode|pad2}'
  steps:
  - strip_brackets
  - dots_to_spaces
  - underscores_to_spaces
  extensions:
  - mkv
  - mp4
  - avi
- name: movie
  pattern: '^(?P<title>.+?) (?P<year>(?:19|20)\d{2})(?: |$)'
  template: '{title} ({year})'
  steps:
  - strip_brackets
  - dots_to_spaces
  - underscores_to_spaces
  extensions:
  - mkv
  - mp4
  - avi
